[project]
name = "cancer-covid-sp"
version = "0.1.0"
description = "Análise exploratória de câncer e COVID-19 na Região Metropolitana de São Paulo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyterlab>=4.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "seaborn>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cancer_covid"]

[tool.pytest.ini_options]
testpaths = ["tests"]

